name: Build APK + web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > app/release.jks; fi
          if [ -f app/release.jks ]; then
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Kunci tanda tangan tidak ada — APK memakai kunci debug dan TIDAK dirilis."
          fi

      - name: Uji mesin OMR
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --console=plain 2>&1 | tee test.log || {
            grep -hE "^e: |error:|What went wrong|FAILED|AssertionError|seed [0-9]+ q|expected" test.log app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -60 > err.txt || true
            python3 -c "import sys,urllib.parse;t=open('err.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A');print('::error title=Uji OMR gagal::'+t[:60000])"
            exit 1; }

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --console=plain 2>&1 | tee build.log || {
            grep -hE "^e: |error:|What went wrong|Could not|failed" -A2 build.log | head -80 > err.txt || true
            python3 -c "t=open('err.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A');print('::error title=Build gagal::'+t[:60000])"
            exit 1; }

      - name: Build web
        run: node web/build.js 1.0.${{ github.run_number }}

      - name: Siapkan file
        run: |
          cp app/build/outputs/apk/release/app-release.apk KoreksiLJK-1.0.${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk KoreksiLJK.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KoreksiLJK-1.0.${{ github.run_number }}
          path: KoreksiLJK-1.0.${{ github.run_number }}.apk

      - name: Terbitkan rilis
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n' "${MSG:-Pembaruan}" > notes.txt
          gh release create "v1.0.${{ github.run_number }}" KoreksiLJK.apk web/dist/index.html web/dist/sw.js web/dist/manifest.webmanifest web/dist/icon.svg \
            --title "Koreksi LJK 1.0.${{ github.run_number }}" --notes-file notes.txt
